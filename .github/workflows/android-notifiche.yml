# App Android di prova delle notifiche (D-102), cartella "android-notifiche".
# Separata da Soldirini: non pubblica niente sul sito. Fa le prove del lettore, crea l'APK di debug,
# controlla che l'APK non chieda permessi (niente INTERNET) e che il backup sia spento, poi lo allega alla run.
# Versioni controllate il 18/11/2026: tag dei repository delle azioni (tutte su Node 24) e pagina ufficiale di AGP 9.5.
name: App di prova notifiche
on:
  push:
    paths:
      - 'android-notifiche/**'
      - '.github/workflows/android-notifiche.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-notifiche-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    name: Prove e APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-notifiche
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
      - name: Prove del lettore delle notifiche
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: APK di debug
        run: gradle --no-daemon :app:assembleDebug
      - name: Controllo dell'APK (nessun permesso, backup spento)
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          AAPT2="$ANDROID_HOME/build-tools/$BT/aapt2"
          echo "Strumento: $AAPT2"
          "$AAPT2" dump permissions "$APK" | tee permessi.txt
          if grep -q "uses-permission" permessi.txt; then
            echo "::error::L'APK chiede dei permessi: non deve chiederne nessuno (in particolare INTERNET)."
            exit 1
          fi
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > manifesto.txt
          grep -E "allowBackup|dataExtractionRules|BIND_NOTIFICATION_LISTENER_SERVICE" manifesto.txt
          if ! grep -qE "allowBackup\([^)]*\)=false" manifesto.txt; then
            echo "::error::allowBackup non è false."
            exit 1
          fi
          if ! grep -q "dataExtractionRules" manifesto.txt; then
            echo "::error::Mancano le regole che escludono i dati dal backup."
            exit 1
          fi
          mkdir -p ../consegna
          cp "$APK" ../consegna/prova-notifiche.apk
          sha256sum ../consegna/prova-notifiche.apk
      - uses: actions/upload-artifact@v7
        with:
          path: consegna/prova-notifiche.apk
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Risultati delle prove se qualcosa non va
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: risultati-prove-notifiche
          path: android-notifiche/app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
